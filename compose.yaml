services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
      POSTGRES_DB: ticketing
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  app:
    build: .
    environment:
      TICKETING_DATABASE_URL: postgresql+asyncpg://ticketing:ticketing@postgres:5432/ticketing
      TICKETING_REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
